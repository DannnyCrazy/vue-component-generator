<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI 组件工坊：用 AI 生成 Vue 3 组件，并在当前网页中实时加载运行" />
    <title>AI 组件工坊 · 生成即加载的 Vue 组件工作台</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2342d392'/%3E%3Cpath d='M16 6l9 5.2v9.6L16 26l-9-5.2v-9.6z' fill='none' stroke='%23071a12' stroke-width='2.2' stroke-linejoin='round'/%3E%3Cpath d='M12 20.5L16 11l4 9.5' fill='none' stroke='%23071a12' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <script>
      // 在首屏渲染前应用主题，避免闪白/闪黑
      try {
        var saved = localStorage.getItem('acs.theme')
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
